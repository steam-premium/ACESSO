<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Premium — Como ter todos jogos os titulos</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* ─── TOKENS ─────────────────────────────────────────── */
        :root {
            --red:        #e50914;
            --red-glow:   rgba(229, 9, 20, 0.55);
            --red-dim:    rgba(229, 9, 20, 0.15);
            --black:      #000000;
            --surface:    #0d0d0d;
            --border:     rgba(255,255,255,0.07);
            --text:       #ffffff;
            --muted:      rgba(255,255,255,0.45);
            --progress-h: 4px;

            --wa-green:      #25d366;
            --wa-green-dark: #1b8a3d;
            --wa-green-glow: rgba(37,211,102,0.45);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--black);
            font-family: 'Barlow', sans-serif;
            color: var(--text);
            overflow-x: hidden;
        }

        /* ─── GRAIN OVERLAY ──────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        /* ─── LAYOUT ─────────────────────────────────────────── */
        .page {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 48px 16px 60px;
        }

        /* ─── LOGO ───────────────────────────────────────────── */
        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.12em;
            color: var(--red);
            margin-bottom: 36px;
            text-shadow: 0 0 24px var(--red-glow);
        }

        /* ─── HEADLINE ───────────────────────────────────────── */
        .headline {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 6vw, 3.6rem);
            line-height: 1.05;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            text-align: center;
            max-width: 780px;
            margin-bottom: 40px;
        }
        .headline em {
            font-style: normal;
            color: var(--red);
            text-shadow: 0 0 32px var(--red-glow);
        }

        /* ─── VIDEO CARD ─────────────────────────────────────── */
        .video-card {
            width: 100%;
            max-width: 820px;
            background: var(--surface);
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 8px 60px rgba(0,0,0,0.8),
                0 0 80px var(--red-dim);
            overflow: hidden;
            position: relative;
        }

        .video-ratio {
            position: relative;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding-bottom: 177.78%; /* 9:16 — modo retrato */
        }
        .video-ratio #player {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-blocker {
            position: absolute;
            inset: 0;
            z-index: 10;
            cursor: default;
            -webkit-tap-highlight-color: transparent;
        }

        body.video-fullscreen-active { overflow: hidden; }

        .video-card.fake-fs-active {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            border-radius: 0;
            border: none;
            box-shadow: none;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
        }
        .video-card.fake-fs-active .video-ratio {
            width: 100%;
            height: 100%;
            padding-bottom: 0;
            overflow: hidden;
        }
        .video-card.fake-fs-active .video-ratio #player,
        .video-card.fake-fs-active .video-ratio iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .video-card.fake-fs-active .progress-track,
        .video-card.fake-fs-active .progress-meta {
            display: none;
        }

        .video-controls {
            position: absolute;
            right: 10px;
            bottom: 10px;
            z-index: 30;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .video-controls.active { display: flex; }
        .vc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 38px;
            padding: 0 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 6px;
            color: #fff;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s ease;
        }
        .vc-btn:hover, .vc-btn:active { background: rgba(0,0,0,0.85); }
        .vc-btn svg { width: 18px; height: 18px; fill: #fff; pointer-events: none; }

        /* ─── CLICK-TO-PLAY OVERLAY ──────────────────────────── */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            background: rgba(0,0,0,0.82);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            cursor: pointer;
            transition: opacity 0.4s ease;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }

        .overlay-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse-icon 1.8s ease-in-out infinite;
        }
        .overlay-icon svg { width: 28px; height: 28px; fill: #fff; margin-left: 4px; }
        .overlay-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: var(--red);
            padding: 10px 28px;
            border-radius: 4px;
            animation: pulse-btn 1.8s ease-in-out infinite;
        }

        /* ─── PROGRESS BAR ───────────────────────────────────── */
        .progress-track {
            width: 100%;
            height: var(--progress-h);
            background: rgba(255,255,255,0.1);
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c40812, var(--red) 60%, #ff4444);
            border-radius: 0 2px 2px 0;
            box-shadow: 0 0 10px var(--red);
            transition: width 0.5s linear;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -1px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 6px var(--red);
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 14px;
        }
        .progress-label {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .progress-pct {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            color: var(--red);
        }

        /* ═══════════════════════════════════════════════════════════
           BOTÃO DE WHATSAPP — único CTA após o vídeo
           ═══════════════════════════════════════════════════════════ */
        #whatsapp-wrap {
            width: 100%;
            max-width: 820px;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(16px);
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.6s ease, transform 0.6s ease, max-height 0.6s ease, margin-top 0.6s ease;
            text-align: center;
        }
        #whatsapp-wrap.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
            max-height: 400px;
        }
        .whatsapp-heading {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: clamp(1.2rem, 3.6vw, 1.5rem);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .whatsapp-subheading {
            font-size: 0.88rem;
            color: var(--muted);
            max-width: 460px;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 18px 44px;
            max-width: 480px;
            width: 100%;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, var(--wa-green-dark) 0%, var(--wa-green) 55%, #34e37a 100%);
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow:
                0 0 0 2px rgba(37,211,102,0.25),
                0 0 34px var(--wa-green-glow),
                0 6px 26px rgba(0,0,0,0.6);
            transition: box-shadow 0.25s ease, transform 0.25s ease;
            animation: float-cta 2.6s ease-in-out infinite;
        }
        .whatsapp-btn:hover {
            box-shadow: 0 0 0 2px rgba(37,211,102,0.55), 0 0 48px var(--wa-green-glow), 0 6px 26px rgba(0,0,0,0.6);
            transform: translateY(-3px);
        }
        .whatsapp-btn svg { width: 24px; height: 24px; fill: #fff; flex-shrink: 0; }

        /* ─── ANIMATIONS ─────────────────────────────────────── */
        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%       { transform: scale(1.08); opacity: 0.85; }
        }
        @keyframes pulse-btn {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 rgba(229,9,20,0); }
            50%       { transform: scale(1.03); box-shadow: 0 0 18px rgba(229,9,20,0.6); }
        }
        @keyframes float-cta {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-6px); }
        }

        /* ─── MOBILE ─────────────────────────────────────────── */
        @media (max-width: 600px) {
            .page { padding: 28px 8px 48px; }
            .logo { font-size: 1.6rem; margin-bottom: 22px; }
            .video-card { border-radius: 6px; }
            .whatsapp-btn { padding: 16px 24px; font-size: 1rem; }
        }
    </style>

</head>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    /* ═══════════════════════════════════════════════════════════
       CONFIGURAÇÃO  — edite apenas estas constantes
       ═══════════════════════════════════════════════════════════ */
    const VIDEO_ID    = '7svZ-mjA2V4';          // ← ID do vídeo do YouTube
    const CTA_SECOND  = 2;                     // 3 min 37s — momento em que o botão de WhatsApp aparece
    /* ═══════════════════════════════════════════════════════════ */

    let player;
    let progressInterval = null;
    let ctaTimer         = null;
    let started          = false;

    /* Estado dos controles e da tela cheia */
    let isPaused      = false;
    let userPaused     = false;
    let speedIndex     = 0;
    const SPEED_STEPS  = [1, 1.5, 2];
    let isFullscreen   = false;
    let videoEnded      = false;
    let ctaShown        = false;

    /* ── YouTube Player ready ── */
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '100%',
            width:  '100%',
            videoId: VIDEO_ID,
            playerVars: {
                autoplay:        1,
                mute:            1,
                controls:        0,   // hide native controls
                disablekb:       1,   // disable keyboard shortcuts
                rel:             0,
                modestbranding:  1,
                iv_load_policy:  3,   // hide annotations
                fs:              0,   // no fullscreen button
                playsinline:     1,
            },
            events: {
                onReady:       onPlayerReady,
                onStateChange: onPlayerStateChange,
                onError:       onPlayerError,
            }
        });
    }

    function onPlayerError(e) {
        const motivos = {
            2:   'ID de vídeo inválido.',
            5:   'Erro ao reproduzir no player HTML5.',
            100: 'Vídeo não encontrado, privado ou removido.',
            101: 'O dono do vídeo desativou a reprodução em outros sites (embed).',
            150: 'O dono do vídeo desativou a reprodução em outros sites (embed).'
        };
        console.error('Erro no player do YouTube (código ' + e.data + '): ' + (motivos[e.data] || 'motivo desconhecido'));
    }

    function onPlayerReady(e) {
        try {
            e.target.setPlaybackQuality('highres');
        } catch(_){}
    }

    function onPlayerStateChange(e) {
        if (e.data === YT.PlayerState.PAUSED && started && !userPaused) {
            setTimeout(() => { try { player.playVideo(); } catch(_){} }, 200);
        }

        if (e.data === YT.PlayerState.PLAYING) {
            isPaused = false;
            updatePlayPauseIcon();
            try { player.setPlaybackQuality('highres'); } catch(_){}
        }
        if (e.data === YT.PlayerState.PAUSED) {
            isPaused = true;
            updatePlayPauseIcon();
        }

        if (e.data === YT.PlayerState.ENDED) {
            videoEnded = true;
            if (ctaShown) exitFakeFullscreen();
        }
    }

    /* ── User clicks overlay → unmute & start experience ── */
    function startVideo() {
        if (started) return;
        started = true;

        const overlay = document.getElementById('overlay');
        overlay.classList.add('hidden');

        try {
            player.unMute();
            player.seekTo(0, true);
            player.playVideo();
        } catch(err) { console.warn('Player not ready yet', err); }

        startFakeProgress();
        scheduleCTA();

        document.getElementById('videoControls').classList.add('active');
    }

    /* ── Fake progress bar ── */
    const K = 0.012;

    function easeProgress(elapsed) {
        const raw = 95 * (1 - Math.exp(-K * elapsed));
        return Math.min(raw, 95);
    }

    let elapsedSec = 0;

    function startFakeProgress() {
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            elapsedSec += 0.5;
            const pct = easeProgress(elapsedSec);
            setProgressUI(pct);
        }, 500);
    }

    function setProgressUI(pct) {
        const fill = document.getElementById('progressFill');
        const label = document.getElementById('progressPct');
        if (fill)  fill.style.width = pct.toFixed(1) + '%';
        if (label) label.textContent = Math.round(pct) + '%';
    }

    /* ── Schedule the CTA button ── */
    function scheduleCTA() {
        ctaTimer = setTimeout(showCTA, CTA_SECOND * 1000);
    }

    function showCTA() {
        clearInterval(progressInterval);
        setProgressUI(100);
        document.querySelector('.progress-label').textContent = 'Acesso liberado!';

        document.getElementById('whatsapp-wrap').classList.add('visible');

        if (typeof fbq === 'function') {
            fbq('track', 'Lead');
        }

        ctaShown = true;
        if (videoEnded) exitFakeFullscreen();
    }

    /* ═══════════════════════════════════════════════════════════
       Controles customizados
       ═══════════════════════════════════════════════════════════ */
    const ICON_PLAY  = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

    function updatePlayPauseIcon() {
        const icon = document.getElementById('iconPlayPause');
        if (icon) icon.outerHTML = isPaused ? ICON_PLAY.replace('<svg ', '<svg id="iconPlayPause" ') : ICON_PAUSE.replace('<svg ', '<svg id="iconPlayPause" ');
    }

    document.getElementById('btnPlayPause').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!started || !player) return;
        if (isPaused) {
            userPaused = false;
            player.playVideo();
            startFakeProgress();
        } else {
            userPaused = true;
            player.pauseVideo();
            clearInterval(progressInterval);
        }
    });

    document.getElementById('btnSpeed').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!started || !player) return;
        speedIndex = (speedIndex + 1) % SPEED_STEPS.length;
        const rate = SPEED_STEPS[speedIndex];
        try { player.setPlaybackRate(rate); } catch(_){}
        document.getElementById('btnSpeed').textContent = rate + 'x';
    });

    document.getElementById('btnFullscreen').addEventListener('click', (e) => {
        e.stopPropagation();
        if (isFullscreen) exitFakeFullscreen(); else enterFakeFullscreen();
    });

    /* ═══════════════════════════════════════════════════════════
       Tela cheia falsa (via CSS, sem controles nativos)
       ═══════════════════════════════════════════════════════════ */
    function enterFakeFullscreen() {
        if (isFullscreen) return;
        isFullscreen = true;
        const el = document.querySelector('.video-card');
        document.body.classList.add('video-fullscreen-active');
        el.classList.add('fake-fs-active');
    }

    function exitFakeFullscreen() {
        if (!isFullscreen) return;
        isFullscreen = false;
        const el = document.querySelector('.video-card');
        document.body.classList.remove('video-fullscreen-active');
        el.classList.remove('fake-fs-active');
    }

    /* ── Prevent right-click context menu on the video area ── */
    document.addEventListener('contextmenu', e => {
        if (e.target.closest('.video-card')) e.preventDefault();
    });

    /* ── Prevent keyboard shortcuts that might trigger YouTube ── */
    document.addEventListener('keydown', e => {
        const blocked = [' ', 'k', 'K', 'ArrowLeft', 'ArrowRight', 'j', 'J', 'l', 'L', 'f', 'F', 'm', 'M'];
        if (blocked.includes(e.key)) e.preventDefault();
    });
</script>
</body>
</html>
